
name: Deploy ZyDoc Backend

on:
  push:
    branches:
      - main
      - production-test
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: zydoc-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::354596761620:role/ZyDocGitHubActionsDeployRole
          aws-region: ap-south-1

      - name: Deploy selected branch via SSM
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
          EC2_INSTANCE_ID: i-09968620193094399
        shell: bash
        run: |
          set -euo pipefail

          jq -n --arg branch "$DEPLOY_BRANCH" '{
            commands: [
              "set -e",
              ("sudo -u ubuntu -H git -C /home/ubuntu/zydoc-backend fetch origin " + $branch),
              ("sudo -u ubuntu -H git -C /home/ubuntu/zydoc-backend checkout -B " + $branch + " origin/" + $branch),
              "cd /home/ubuntu/zydoc-backend && docker compose up -d --build",
              "cd /home/ubuntu/zydoc-backend && docker compose ps",
              "cd /home/ubuntu/zydoc-backend && docker compose logs --tail=100 backend"
            ]
          }' > commands.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://commands.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --query "CommandInvocations[0].Status" \
              --output text)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "[StandardErrorContent,StandardOutputContent]" \
                  --output text
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for SSM command completion."
          exit 1
